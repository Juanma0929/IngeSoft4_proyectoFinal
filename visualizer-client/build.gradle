plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':shared')
}

javafx {
    version = '17.0.2'
    modules = ['javafx.controls', 'javafx.web']
}

application {
    mainClass = 'edu.icesi.sitmmio.visualizer.VisualizerMain'
}
